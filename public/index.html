<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Insight</title>
<meta name="description" content="Business Insight: Interactive Sales &amp; Profitability Dashboard">
<link rel="preload" href="data/cols.bin.gz" as="fetch" crossorigin>
<style>
:root{--bg:#f4f5f8;--side:#ffffff;--tx:#1f2937;--mut:#6b7280;--bd:#e5e7eb;--ac:#6D4AFF;--card:#ffffff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--bd)}
.top .brand{font-weight:700;font-size:16px;white-space:nowrap}
.top .links{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.top .sp{flex:1}
#langBtn{cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:13px}
#langBtn:hover{opacity:.9}
.wrap{display:flex;align-items:flex-start}
aside{width:290px;flex:none;background:#fff;border-right:1px solid var(--bd);padding:18px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
aside h2{font-size:15px;margin:0 0 4px}aside .cap{color:var(--mut);font-size:12px;margin-bottom:14px}
aside label{display:block;font-size:12px;font-weight:600;margin:12px 0 4px}
aside select,aside input[type=date]{width:100%;padding:7px 8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);font:inherit}
.dates{display:flex;gap:6px}
#reset{margin-top:16px;width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);cursor:pointer;font-weight:600}
#reset:hover{border-color:var(--ac);color:var(--ac)}
details{margin-top:18px;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;background:var(--bg)}
summary{cursor:pointer;font-weight:600;font-size:13px}
#gloss{padding-left:16px;margin:8px 0 0;font-size:12px;color:var(--mut)}#gloss b{color:var(--tx)}
main{flex:1;min-width:0;padding:22px 28px 40px}
h1{font-size:30px;margin:0}.sub{color:var(--mut);margin:2px 0 10px}
.intro{margin:0 0 14px}
#banner{background:#efeaff;border:1px solid #d9d0ff;border-radius:6px;padding:9px 12px;margin-bottom:16px;font-size:13px}
#empty{display:none;background:rgba(245,133,24,.12);border:1px solid rgba(245,133,24,.4);border-radius:6px;padding:12px}
.grid{display:grid;gap:14px}
.kp{grid-template-columns:repeat(5,1fr);margin-bottom:18px}
.kpi{box-shadow:0 1px 3px rgba(16,24,40,.06);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:var(--card)}
.kl{font-size:12px;color:var(--mut)}.kv{font-size:26px;font-weight:700;line-height:1.25}.kv.sm{font-size:19px}.kd{font-size:12px;color:#2e9e5b;margin-top:2px}
.two{grid-template-columns:1fr 1fr;margin-bottom:14px}
.card{box-shadow:0 1px 3px rgba(16,24,40,.06);border:1px solid var(--bd);border-radius:12px;padding:12px 12px 4px;background:var(--card);min-width:0}
.card h3{font-size:14px;margin:0 0 4px}
.plot{height:320px}.plot.tall{height:380px}
h2.sec{font-size:20px;margin:26px 0 10px}
.snap{grid-template-columns:repeat(4,1fr)}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:8px;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;text-align:left}
th{position:sticky;top:0;background:#f1f2f6;cursor:pointer;user-select:none}
.r{text-align:right}
.pg{display:flex;gap:10px;align-items:center;margin-top:10px}
.pg button{padding:6px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);cursor:pointer}
.pg button:disabled{opacity:.4;cursor:default}
.cap2{color:var(--mut);font-size:12px;margin:0 0 8px}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--bd);color:var(--mut);font-size:12px;text-align:center}
#loader{position:fixed;inset:53px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:10;color:var(--mut)}
.spin{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:1100px){.kp{grid-template-columns:repeat(3,1fr)}.snap{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
 .wrap{flex-direction:column;align-items:stretch}aside{width:100%;position:static;height:auto;border-right:0;border-bottom:1px solid var(--bd)}
 main{padding:16px}.two{grid-template-columns:1fr}.kp{grid-template-columns:1fr 1fr}.top{padding:8px 12px;gap:10px}.top .links{display:none}h1{font-size:24px}
}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Business Insight</span>
  <span class="links"><a href="https://businessinsightsintreactivewebapp.streamlit.app/" target="_blank" rel="noopener" data-i="orig">Original Streamlit app ↗</a><a href="https://github.com/Abhishek24122000/Business_insights_intreactive_webapp" target="_blank" rel="noopener" data-i="src">Source ↗</a></span>
  <span class="sp"></span>
  <button id="langBtn" type="button">日本語</button>
</div>
<div id="loader"><div class="spin"></div><div id="loadMsg">Loading…</div></div>
<div class="wrap" id="app" style="visibility:hidden">
<aside>
  <h2>Business Insight</h2><div class="cap" data-i="caption"></div>
  <details><summary data-i="gTitle"></summary><ul id="gloss"></ul></details>
  <label data-i="fDate"></label>
  <div class="dates"><input type="date" id="fFrom"><input type="date" id="fTo"></div>
  <label data-i="fRegion"></label><select id="fRegion"></select>
  <label data-i="fCategory"></label><select id="fCategory"></select>
  <label data-i="fSub"></label><select id="fSub"></select>
  <label data-i="fState"></label><select id="fState"></select>
  <label data-i="fCity"></label><select id="fCity"></select>
  <button id="reset" type="button" data-i="reset"></button>
</aside>
<main>
  <h1>Business Insight</h1>
  <div class="sub" data-i="subtitle"></div>
  <p class="intro" data-i="intro"></p>
  <div id="banner"></div>
  <div id="empty"></div>
  <div id="content">
    <div class="grid kp" id="kpis"></div>
    <div class="grid two">
      <div class="card"><h3 data-i="cRevTrend"></h3><div class="plot" id="ch_rev_trend"></div></div>
      <div class="card"><h3 data-i="cProfitTrend"></h3><div class="plot" id="ch_pro_trend"></div></div>
    </div>
    <div class="grid two">
      <div class="card"><h3 data-i="cRegion"></h3><div class="plot" id="ch_region"></div></div>
      <div class="card"><h3 data-i="cCat"></h3><div class="plot" id="ch_cat"></div></div>
    </div>
    <div class="grid two">
      <div class="card"><h3 data-i="cProfCat"></h3><div class="plot" id="ch_pcat"></div></div>
      <div class="card"><h3 data-i="cSub"></h3><div class="plot" id="ch_sub"></div></div>
    </div>
    <div class="grid two">
      <div class="card"><h3 data-i="cProd"></h3><div class="plot tall" id="ch_prod"></div></div>
      <div class="card"><h3 data-i="cCust"></h3><div class="plot tall" id="ch_cust"></div></div>
    </div>
    <div class="grid two">
      <div class="card"><h3 data-i="cState"></h3><div class="plot tall" id="ch_state"></div></div>
      <div class="card"><h3 data-i="cCity"></h3><div class="plot tall" id="ch_city"></div></div>
    </div>
    <div class="card" style="margin-bottom:14px"><h3 data-i="cScatter"></h3><div class="plot tall" id="ch_scatter"></div></div>
    <h2 class="sec" data-i="snap"></h2>
    <div class="grid snap" id="snap"></div>
    <h2 class="sec" data-i="tbl"></h2>
    <p class="cap2" id="tblCap"></p>
    <div class="tw"><table id="tbl"></table></div>
    <div class="pg"><button id="prev" type="button"></button><span id="pgInfo"></span><button id="next" type="button"></button></div>
  </div>
  <footer data-i="footer"></footer>
</main>
</div>
<script src="vendor/plotly-basic.min.js"></script>
<script src="i18n.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
